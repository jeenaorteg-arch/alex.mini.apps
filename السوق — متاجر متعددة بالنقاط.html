<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السوق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#eef3ef;--s1:#fbfdfb;--s2:#e3ece6;--tx:#1d2d29;--mu:#64807a;--ac:#2f8f78;--acs:#d5eee5;--gold:#a9761f;--golds:#f5e8c9;--rd:#c4554c;--rds:#f7dcd8;--ln:#d3e0d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1b;--s1:#16262a;--s2:#1e3237;--tx:#e4eee9;--mu:#8ba7a1;--ac:#7fd1b0;--acs:#1f3f3a;--gold:#e8c98e;--golds:#3a3322;--rd:#eb9b92;--rds:#3d2524;--ln:#26403f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1b;--s1:#16262a;--s2:#1e3237;--tx:#e4eee9;--mu:#8ba7a1;--ac:#7fd1b0;--acs:#1f3f3a;--gold:#e8c98e;--golds:#3a3322;--rd:#eb9b92;--rds:#3d2524;--ln:#26403f;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.7 'Readex Pro',Tahoma,system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-weight:600;font-size:22px}
.pill{background:var(--golds);color:var(--gold);padding:6px 14px;border-radius:99px;font-weight:500}
.ib{width:38px;height:38px;border-radius:50%;background:var(--s2);font-size:17px}
h2{font-size:18px;font-weight:600;margin:22px 0 10px}
h3{font-size:16px;font-weight:600}
.mu{color:var(--mu);font-size:13px}
.search{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--s1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);white-space:nowrap}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:start;width:100%;display:block}
.card.hot{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.av{width:46px;height:46px;border-radius:15px;background:var(--acs);display:grid;place-items:center;font-size:22px;flex:none}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--acs);color:var(--ac)}
.tag.g{background:var(--golds);color:var(--gold)}.tag.r{background:var(--rds);color:var(--rd)}
.btn{background:var(--ac);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:500;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.sec{background:var(--s2);color:var(--tx)}.btn.bad{background:var(--rds);color:var(--rd)}.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:7px 16px;font-size:13px}
.stack>*+*{margin-top:10px}
.hero{background:linear-gradient(135deg,var(--acs),var(--golds));border-radius:24px;padding:22px}
.hero .big{font-size:34px;font-weight:600}
input.f,textarea.f,select.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg)}
textarea.f{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.nav{position:fixed;inset:auto 0 0;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav div{pointer-events:auto;display:flex;gap:2px;background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:6px;box-shadow:0 8px 30px rgba(20,50,45,.15)}
.nav button{padding:8px 14px;border-radius:16px;font-size:12px;color:var(--mu);display:grid;justify-items:center;gap:0;line-height:1.5}
.nav button span{font-size:19px}.nav button.on{background:var(--acs);color:var(--ac)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--s1);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.step{display:flex;gap:6px;margin-bottom:16px}.step i{flex:1;height:5px;border-radius:9px;background:var(--s2)}.step i.on{background:var(--ac)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.qty button{width:44px;height:44px;border-radius:14px;background:var(--s2);font-size:20px}.qty b{font-size:24px;min-width:70px;text-align:center}
.sum{background:var(--bg);border-radius:16px;padding:14px}.sum .row{padding:4px 0}
.tl{position:relative;margin:14px 0 4px;padding-inline-start:26px}
.tl div{position:relative;padding-bottom:14px;color:var(--mu);font-size:13px}
.tl div::before{content:"";position:absolute;inset-inline-start:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--s2);border:2px solid var(--ln)}
.tl div::after{content:"";position:absolute;inset-inline-start:-21px;top:19px;bottom:-5px;width:2px;background:var(--ln)}
.tl div:last-child::after{display:none}
.tl div.ok{color:var(--tx)}.tl div.ok::before{background:var(--ac);border-color:var(--ac)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:40;font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pk button{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
const CATS=[{id:1,n:'حسابات',e:'👤',k:'p'},{id:2,n:'أرقام',e:'📱',k:'p'},{id:3,n:'هدايا',e:'🎁',k:'p'},{id:4,n:'أجهزة',e:'💻',k:'p'},{id:5,n:'رشق وخدمات',e:'🚀',k:'s'}];
const STORES=[
{id:1,n:'متجر الأمان',d:'حسابات مضمونة مع ضمان استبدال لمدة أسبوع.',c:1,u:'@amaan_store',sales:128,rs:61,rc:13,hot:1},
{id:2,n:'نجوم الرشق',d:'خدمات رشق سريعة وآمنة لكل المنصات.',c:5,u:'@rashq_stars',sales:342,rs:226,rc:49,hot:1},
{id:3,n:'عالم الأرقام',d:'أرقام مؤقتة ودائمة لتفعيل التطبيقات.',c:2,u:'@numbers_world',sales:75,rs:33,rc:8},
{id:4,n:'بيت الهدايا',d:'بطاقات وهدايا رقمية تصلك خلال دقائق.',c:3,u:'@gift_house',sales:51,rs:24,rc:6}];
const ITEMS=[
{id:1,s:1,n:'حساب ألعاب كامل',d:'حساب ألعاب بمستوى عالٍ مع الإيميل الأصلي وبيانات الاسترجاع.',p:12,per:1,min:1,max:1,st:5},
{id:2,s:1,n:'حساب تواصل موثّق',d:'حساب قديم بمتابعين حقيقيين مع تغيير الإيميل عند التسليم.',p:20,per:1,min:1,max:1,st:2},
{id:3,s:2,n:'متابعين إنستغرام',d:'رشق متابعين بدون كلمة سر، يبدأ التنفيذ خلال ساعة.',p:3,per:1000,min:1000,max:10000,st:-1,svc:1},
{id:4,s:2,n:'مشاهدات فيديو',d:'مشاهدات حقيقية ترفع ظهور الفيديو الخاص بك.',p:1,per:1000,min:1000,max:50000,st:-1,svc:1},
{id:5,s:3,n:'بطاقة هدية 10$',d:'كود بطاقة رقمية يُسلَّم بالرسائل الخاصة بعد التنفيذ.',p:15,per:1,min:1,max:3,st:9},
{id:6,s:4,n:'بطاقة متجر 25$',d:'كود بطاقة رقمية صالح عالمياً مع ضمان الاستلام.',p:34,per:1,min:1,max:2,st:4},
{id:7,s:3,n:'رقم تفعيل دولة أوروبية',d:'رقم مؤقت لاستلام رمز التفعيل خلال عشرين دقيقة.',p:4,per:1,min:1,max:5,st:20}];
ITEMS.forEach(i=>{if(i.id==6)i.s=3});
const STEPS=['تم حجز نقاطك','البائع يجهّز طلبك','تم التسليم','أكّدت الاستلام'];
const PKGS=[[5,10],[10,20],[25,45],[50,85]];
const PROMO=[[1,5],[3,12],[7,25]];
let S={tab:'market',cat:0,q:'',store:null,pts:30,orders:[],last:0,ref:3,my:null,earn:0,sellerOrders:[
{id:48213,b:'u***4',item:'متابعين إنستغرام',qty:2000,price:6,st:0},{id:70952,b:'a***7',item:'حساب ألعاب كامل',qty:1,price:12,st:1}],buy:null,tasks:[[1,'قناة الأخبار',2],[2,'قناة العروض',1]],done:[],stores:STORES.slice()};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('ar-EG');
const cat=id=>CATS.find(c=>c.id==id);
const stars=s=>s.rc?(s.rs/s.rc).toFixed(1)+' ★':'جديد';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function go(t){S.tab=t;S.store=null;render();scrollTo(0,0)}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function total(i,q){return Math.ceil(q/i.per*i.p)}
function head(){return `<div class="top"><div class="brand">🛍 السوق</div><div class="row"><span class="pill">💰 ${nf(S.pts)} نقطة</span><button class="ib" onclick="theme()" aria-label="تبديل المظهر">🌓</button></div></div>`}
function storeCard(s){const c=cat(s.c);return `<button class="card ${s.hot?'hot':''}" onclick="openStore(${s.id})"><div class="row"><div class="av">${c.e}</div><div style="flex:1"><div class="row sp"><h3>${esc(s.n)}</h3>${s.hot?'<span class="tag g">مميز</span>':''}</div><div class="mu">${c.n} · ${stars(s)} · ${nf(s.sales)} عملية بيع</div></div></div><p class="mu" style="margin-top:10px">${esc(s.d)}</p></button>`}
function itemCard(i){const out=i.st==0;return `<button class="card" onclick="openBuy(${i.id})" ${out?'disabled':''}><div class="row sp"><h3>${esc(i.n)}</h3><span class="tag g">${nf(i.p)} نقطة${i.per>1?' / '+nf(i.per):''}</span></div><p class="mu" style="margin:6px 0">${esc(i.d)}</p><span class="mu">${i.st<0?'متوفر دائماً':out?'نفد':'المتبقي '+nf(i.st)}</span></button>`}
function market(){
 if(S.store){const s=S.stores.find(x=>x.id==S.store),its=ITEMS.filter(i=>i.s==s.id);
  return `<button class="chip" onclick="S.store=null;render()">→ رجوع</button><div class="card stack" style="margin:12px 0"><div class="row"><div class="av">${cat(s.c).e}</div><div><h3>${esc(s.n)}</h3><div class="mu">${stars(s)} · ${nf(s.sales)} عملية بيع · ${esc(s.u)}</div></div></div><p>${esc(s.d)}</p><div class="mu">🔒 نقاطك محجوزة عند الشراء ولا تصل للبائع إلا بعد تأكيدك الاستلام.</div></div><h2>المنتجات</h2><div class="grid">${its.map(itemCard).join('')||'<div class="empty">لا توجد منتجات بعد</div>'}</div>`}
 const q=S.q.trim(),list=S.stores.filter(s=>(!S.cat||s.c==S.cat)&&(!q||s.n.includes(q)||s.d.includes(q))).sort((a,b)=>(b.hot||0)-(a.hot||0));
 return head()+`<div class="hero"><div class="mu">رصيدك الحالي</div><div class="big">${nf(S.pts)} نقطة</div><div class="mu" style="margin:4px 0 12px">اشترِ من متاجر موثّقة وكل عملية محمية بالحجز.</div><button class="btn sm" onclick="go('wallet')">اشحن أو اجمع نقاط</button></div><input class="search" style="margin-top:16px" placeholder="ابحث عن متجر أو خدمة" value="${esc(S.q)}" oninput="S.q=this.value;sr()"><div class="chips"><button class="chip ${!S.cat?'on':''}" onclick="S.cat=0;render()">الكل</button>${CATS.map(c=>`<button class="chip ${S.cat==c.id?'on':''}" onclick="S.cat=${c.id};render()">${c.e} ${c.n}</button>`).join('')}</div><div class="grid" id="sl">${list.map(storeCard).join('')||'<div class="empty">ما لقينا متجر بهذا الاسم</div>'}</div>`}
function sr(){const q=S.q.trim(),l=S.stores.filter(s=>(!S.cat||s.c==S.cat)&&(!q||s.n.includes(q)||s.d.includes(q)));$('#sl').innerHTML=l.map(storeCard).join('')||'<div class="empty">ما لقينا متجر بهذا الاسم</div>'}
function openStore(id){S.store=id;render();scrollTo(0,0)}
// ---- الشراء
function openBuy(id){const i=ITEMS.find(x=>x.id==id);S.buy={i,q:i.min,link:'',step:1,note:'',oid:0};sheet()}
function sheet(){const b=S.buy;if(!b){$('#layer').innerHTML='';return}const i=b.i,t=total(i,b.q),s=S.stores.find(x=>x.id==i.s),svc=!!i.svc,inc=i.per>1?i.per:1;
 let body='';
 if(b.step==1)body=`<h3>${esc(i.n)}</h3><div class="mu">من ${esc(s.n)}</div><div class="qty"><button onclick="qt(-1)" aria-label="أقل">−</button><b>${nf(b.q)}</b><button onclick="qt(1)" aria-label="أكثر">+</button></div><div class="mu" style="text-align:center">${nf(t)} نقطة${i.per>1?' · الحد '+nf(i.min)+' إلى '+nf(i.max):''}</div>${svc?`<label>رابط الحساب أو المنشور</label><input class="f" id="lk" dir="ltr" placeholder="https://" value="${esc(b.link)}">`:`<label>ملاحظة للبائع (اختياري)</label><input class="f" id="nt" value="${esc(b.note)}">`}<div style="margin-top:16px"><button class="btn" onclick="nx()">متابعة للمراجعة</button></div>`;
 if(b.step==2)body=`<h3>راجع طلبك</h3><div class="sum" style="margin-top:12px"><div class="row sp"><span>${esc(i.n)}</span><b>× ${nf(b.q)}</b></div>${svc?`<div class="row sp mu"><span>الرابط</span><span dir="ltr">${esc(b.link)}</span></div>`:''}<div class="row sp"><span>رصيدك الآن</span><span>${nf(S.pts)}</span></div><div class="row sp"><b>سيُحجز من رصيدك</b><b style="color:var(--gold)">${nf(t)}</b></div><div class="row sp mu"><span>يتبقى بعد الحجز</span><span>${nf(S.pts-t)}</span></div></div><p class="mu" style="margin:12px 0">النقاط تُحجز ولا يستلمها البائع إلا بعد ما تؤكد الاستلام. إذا ما نفّذ الطلب ترجع لك كاملة.</p><div class="stack"><button class="btn" onclick="cf()" ${S.pts<t?'disabled':''}>${S.pts<t?'رصيدك لا يكفي':'ادفع '+nf(t)+' نقطة'}</button>${S.pts<t?'<button class="btn sec" onclick="S.buy=null;sheet();go(\'wallet\')">اشحن رصيدك</button>':''}<button class="btn sec" onclick="S.buy.step=1;sheet()">تعديل</button></div>`;
 if(b.step==3)body=`<div class="empty" style="padding:6px"><div style="font-size:44px">✅</div><h3 style="color:var(--tx)">وصل طلبك للبائع</h3><div class="mu">رقم الطلب <b style="color:var(--tx)">#${b.oid}</b></div></div><div class="stack"><button class="btn" onclick="S.buy=null;sheet();go('orders')">تتبّع الطلب</button><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://t.me/${s.u.slice(1)}" target="_blank" rel="noopener">راسل البائع ${esc(s.u)}</a></div>`;
 $('#layer').innerHTML=`<div class="sheet-bg" onclick="if(event.target==this){S.buy=null;sheet()}"><div class="sheet"><div class="step"><i class="on"></i><i class="${b.step>1?'on':''}"></i><i class="${b.step>2?'on':''}"></i></div>${body}</div></div>`}
function qt(d){const b=S.buy,i=b.i,inc=i.per>1?i.per:1,mx=i.st>0?Math.min(i.max,i.st):i.max;b.q=Math.max(i.min,Math.min(mx,b.q+d*inc));sheet()}
function nx(){const b=S.buy;if(b.i.svc){b.link=$('#lk').value.trim();if(!/^https?:\/\/.{4,}/.test(b.link))return toast('أدخل رابطاً صحيحاً')}else b.note=($('#nt')||{}).value||'';b.step=2;sheet()}
function cf(){const b=S.buy,t=total(b.i,b.q);if(S.pts<t)return;S.pts-=t;b.oid=String(Math.floor(10000+Math.random()*90000));S.orders.unshift({id:b.oid,i:b.i,q:b.q,link:b.link,price:t,st:0,ts:Date.now()});b.step=3;sheet();if(b.i.st>0)b.i.st-=b.q}
// ---- الطلبات
function orders(){return head()+'<h2 style="margin-top:0">طلباتي</h2>'+(S.orders.length?`<div class="grid">${S.orders.map(o=>{const x=o.st==4,c=o.st==5;return `<div class="card stack"><div class="row sp"><h3>${esc(o.i.n)}</h3><span class="tag ${c?'r':x?'':'g'}">${c?'ملغي':x?'مكتمل':'#'+o.id}</span></div><div class="mu">الكمية ${nf(o.q)} · ${nf(o.price)} نقطة ${x?'':'(محجوزة)'}</div><div class="tl">${STEPS.map((s,k)=>`<div class="${o.st>k||(o.st==4)?'ok':o.st==k?'ok':''}">${s}</div>`).join('')}</div>${act(o)}</div>`}).join('')}</div>`:'<div class="empty">ما عندك طلبات بعد.<br><br><button class="btn sm" onclick="go(\'market\')">تصفّح السوق</button></div>')}
function act(o){if(o.st==2)return `<div class="row"><button class="btn" onclick="ordAct('${o.id}','ok')">استلمت طلبي</button><button class="btn bad" onclick="ordAct('${o.id}','dp')">شكوى</button></div>`;if(o.st<2)return `<button class="btn sec" onclick="ordAct('${o.id}','sim')">تجربة: البائع يتقدّم بالطلب</button>`;return ''}
function ordAct(id,a){const o=S.orders.find(x=>x.id==id);if(a=='sim'){o.st++;toast(o.st==2?'البائع سلّم الطلب':'البائع بدأ التنفيذ')}if(a=='ok'){o.st=4;toast('اكتمل الطلب، شكراً لك');rate(o)}if(a=='dp'){toast('وصلت الشكوى للإدارة، نقاطك تبقى محجوزة');}render()}
function rate(o){S.pts+=0}
// ---- المحفظة
function wallet(){const ok=Date.now()-S.last>86400000;return head()+`<div class="hero"><div class="mu">رصيدك</div><div class="big">${nf(S.pts)} نقطة</div></div><h2>هدية يومية</h2><div class="card row sp"><div><h3>🎁 نقطة مجانية كل يوم</h3><div class="mu">${ok?'جاهزة للاستلام':'تعال بكرة'}</div></div><button class="btn sm" ${ok?'':'disabled'} onclick="S.last=Date.now();S.pts++;toast('+1 نقطة');render()">استلم</button></div><h2>اشحن بنجوم تيليجرام</h2><div class="pk">${PKGS.map((p,k)=>`<button onclick="S.pts+=${p[0]};toast('تمت إضافة ${p[0]} نقطة (تجريبي)');render()"><h3>${nf(p[0])} نقطة</h3><div class="mu">⭐ ${nf(p[1])}</div></button>`).join('')}</div><h2>مهام الاشتراك</h2><div class="stack">${S.tasks.map(t=>`<div class="card row sp"><div><h3>${t[1]}</h3><div class="mu">+${t[2]} نقطة</div></div><button class="btn sm" ${S.done.includes(t[0])?'disabled':''} onclick="S.done.push(${t[0]});S.pts+=${t[2]};toast('+${t[2]} نقطة');render()">${S.done.includes(t[0])?'تم':'اشترك'}</button></div>`).join('')}</div><h2>ادعُ أصدقاءك</h2><div class="card stack"><div class="mu">تأخذ نقطة عن كل صديق يكمل اشتراكه. دعوت ${nf(S.ref)} حتى الآن.</div><input class="f" dir="ltr" readonly value="https://souq.example/?ref=ABC123"><button class="btn sec" onclick="navigator.clipboard&&navigator.clipboard.writeText('https://souq.example/?ref=ABC123');toast('تم النسخ')">انسخ الرابط</button></div>`}
// ---- متجري
function mine(){const m=S.my;let h=head()+'<h2 style="margin-top:0">متجري</h2>';
 if(!m)return h+`<div class="card stack"><h3>افتح متجرك</h3><div class="mu">تُراجع الإدارة طلبك وتتواصل معك قبل الموافقة.</div><label>اسم المتجر</label><input class="f" id="sn"><label>القسم</label><select class="f" id="sc">${CATS.map(c=>`<option value="${c.id}">${c.e} ${c.n}</option>`).join('')}</select><label>وصف المتجر</label><textarea class="f" id="sd"></textarea><label>حسابك على تيليجرام</label><input class="f" id="su" dir="ltr" placeholder="@username"><button class="btn" onclick="req()">أرسل الطلب</button></div>`;
 if(m.st=='pending')return h+`<div class="empty"><div style="font-size:44px">🕓</div><h3 style="color:var(--tx)">طلبك قيد المراجعة</h3><p>سنتواصل معك على ${esc(m.u)}.<br>للتجربة، ادخل تبويب «الإدارة» ووافق على المتجر.</p></div>`;
 const mi=ITEMS.filter(i=>i.s==m.id);
 return h+`<div class="hero"><h3>${esc(m.n)}</h3><div class="row" style="margin-top:8px"><div><div class="mu">أرباح قابلة للسحب</div><b style="font-size:24px">${nf(S.earn)}</b></div><button class="btn sm" onclick="wd()">اسحب</button></div></div>
 <h2>الطلبات الواردة</h2><div class="stack">${S.sellerOrders.map(o=>`<div class="card stack"><div class="row sp"><h3>#${o.id} · ${esc(o.item)}</h3><span class="tag g">${nf(o.price)} نقطة</span></div><div class="mu">المشتري ${o.b} · الكمية ${nf(o.qty)}</div>${o.st==0?`<button class="btn" onclick="so(${o.id},1)">ابدأ التنفيذ</button>`:o.st==1?`<button class="btn" onclick="so(${o.id},2)">تم التسليم</button>`:o.st==2?'<div class="mu">بانتظار تأكيد المشتري</div>':'<span class="tag">تم الاستلام</span>'}</div>`).join('')}</div>
 <h2>منتجاتي</h2><div class="grid">${mi.map(itemCard).join('')}</div><div class="card stack" style="margin-top:12px"><h3>إضافة منتج</h3><input class="f" id="pn" placeholder="اسم المنتج"><textarea class="f" id="pd" placeholder="الوصف (30 حرفاً على الأقل)"></textarea><div class="row"><input class="f" id="pp" type="number" min="1" placeholder="السعر بالنقاط"><input class="f" id="ps" type="number" min="1" placeholder="الكمية"></div><button class="btn" onclick="ap()">أضف المنتج</button></div>
 <h2>روّج لمتجرك</h2><div class="pk">${PROMO.map(p=>`<button onclick="pr(${p[1]},${p[0]})"><h3>${p[0]} ${p[0]==1?'يوم':'أيام'}</h3><div class="mu">${p[1]} نقطة</div></button>`).join('')}</div>`}
function req(){const n=$('#sn').value.trim(),d=$('#sd').value.trim(),u=$('#su').value.trim();if(n.length<3||d.length<10||!/^@\w{4,}/.test(u))return toast('أكمل الاسم والوصف وحساب تيليجرام');S.my={id:100,n,d,c:+$('#sc').value,u,st:'pending',sales:0,rs:0,rc:0};toast('أُرسل الطلب');render()}
function ap(){const n=$('#pn').value.trim(),d=$('#pd').value.trim(),p=+$('#pp').value,s=+$('#ps').value;if(!n||!p||!s)return toast('أكمل الاسم والسعر والكمية');if(d.length<30)return toast('الوصف لازم يكون 30 حرفاً أو أكثر');ITEMS.push({id:Date.now(),s:100,n,d,p,per:1,min:1,max:Math.min(s,5),st:s});toast('أُضيف المنتج');render()}
function so(id,st){const o=S.sellerOrders.find(x=>x.id==id);o.st=st;if(st==2){setTimeout(()=>{o.st=3;S.earn+=Math.floor(o.price*.95);toast('المشتري أكّد الاستلام');if(S.tab=='mine')render()},1800)}render()}
function wd(){if(S.earn<10)return toast('الحد الأدنى للسحب 10 نقاط');toast('أُرسل طلب السحب للإدارة');S.earn=0;render()}
function pr(p,d){if(S.pts<p)return toast('رصيدك لا يكفي');S.pts-=p;S.my.hot=1;toast('تم تمييز متجرك لمدة '+d+' يوم');render()}
// ---- الإدارة
function admin(){const pend=S.my&&S.my.st=='pending';return head()+`<h2 style="margin-top:0">لوحة الإدارة</h2><div class="grid"><div class="card"><div class="mu">المتاجر</div><b style="font-size:24px">${nf(S.stores.length+(S.my&&S.my.st=='ok'?1:0))}</b></div><div class="card"><div class="mu">طلبات المستخدمين</div><b style="font-size:24px">${nf(S.orders.length)}</b></div><div class="card"><div class="mu">نسبة العمولة</div><b style="font-size:24px">٪٥</b></div></div><h2>طلبات فتح المتاجر</h2>${pend?`<div class="card stack"><h3>${esc(S.my.n)}</h3><div class="mu">${esc(S.my.u)} · ${cat(S.my.c).n}</div><p>${esc(S.my.d)}</p><div class="row"><button class="btn" onclick="S.my.st='ok';S.stores.push(S.my);toast('تمت الموافقة');render()">موافقة</button><button class="btn bad" onclick="S.my=null;render()">رفض</button></div></div>`:'<div class="empty">لا توجد طلبات الآن</div>'}`}
function render(){const t=S.tab,v={market,orders,wallet,mine,admin}[t];$('#app').innerHTML=v();const tabs=[['market','🏬','السوق'],['orders','📦','طلباتي'],['wallet','💰','المحفظة'],['mine','🏪','متجري'],['admin','🛡','الإدارة']];$('#layer').dataset.n=1;if(!S.buy)$('#layer').innerHTML='';$('#layer').insertAdjacentHTML('afterbegin','');document.getElementById('nav')?.remove();document.body.insertAdjacentHTML('beforeend',`<nav class="nav" id="nav"><div>${tabs.map(x=>`<button class="${t==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></nav>`);if(S.buy)sheet()}
render();
</script>
</body>
</html>
